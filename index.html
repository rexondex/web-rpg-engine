<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <title>별빛 골짜기</title>
  </head>
  <body>
    <main id="app">
      <header class="topbar">
        <div><span class="eyebrow">SSG ADVENTURE</span><h1>별빛 골짜기</h1></div>
        <div class="top-actions"><button id="quest-menu-button" type="button">퀘스트 <span id="quest-count">0</span></button><button id="save-menu-button" type="button">저장 관리</button></div>
      </header>
      <section id="game-shell" aria-label="게임 화면">
        <div id="game"></div>
        <div id="hud" aria-live="polite">
          <div class="hud-card"><span>생명력</span><strong id="hp-text">100 / 100</strong><div class="meter"><i id="hp-bar"></i></div></div>
          <div class="hud-card quest"><span>현재 목표</span><strong id="quest-text">촌장과 대화하세요</strong></div>
          <div class="minimap-wrap"><div><span id="map-name">별빛 마을</span><b>N</b></div><canvas id="minimap" width="150" height="82" aria-label="미니맵"></canvas></div>
          <div class="controls">이동 <b>WASD / 방향키</b> · 상호작용 <b>E</b> · 공격 <b>SPACE</b></div>
        </div>
        <div id="dialogue" class="panel hidden" role="dialog" aria-modal="true">
          <span id="speaker"></span><p id="dialogue-text"></p><div id="dialogue-choices" class="dialogue-choices hidden"></div><button id="dialogue-next" type="button">계속</button>
        </div>
        <div id="toast" aria-live="assertive"></div>
      </section>
      <p class="autosave-status"><i></i><span id="save-status">자동 저장 준비됨</span></p>
    </main>
    <dialog id="quest-dialog">
      <form method="dialog" class="dialog-head"><div><span class="eyebrow">QUEST JOURNAL</span><h2>모험 일지</h2></div><button aria-label="닫기">×</button></form>
      <div class="quest-tabs"><button type="button" data-filter="all" class="active">전체</button><button type="button" data-filter="active">진행</button><button type="button" data-filter="completed">완료</button></div>
      <div id="quest-list" class="quest-list"></div>
    </dialog>
    <dialog id="save-dialog">
      <form method="dialog" class="dialog-head"><div><span class="eyebrow">SAVE ARCHIVE</span><h2>모험 기록</h2></div><button aria-label="닫기">×</button></form>
      <p>브라우저에는 자동 저장됩니다. 파일로 내려받으면 캐시를 지워도 복원할 수 있습니다.</p>
      <div id="slots" class="slots"></div>
      <div class="file-actions"><button id="export-save" type="button">현재 저장 파일 내려받기</button><label>저장 파일 불러오기<input id="import-save" type="file" accept="application/json,.json" /></label></div>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
